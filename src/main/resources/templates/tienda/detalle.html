<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle</title>
</head>
<body>
    <h1 th:text="${nombreApp}">Nombre App</h1>
    <h2>Detalle del Producto</h2>
    <p>Nombre: <span th:text="${producto.nombre}"></span></p>
    <p>Precio: <span th:text="${producto.precio}"></span></p>
    <p>Categoría: <span th:text="${producto.categoria}"></span></p>
    <br>
    <a th:href="@{/tienda/productos}">Volver a la lista</a>
</body>
</html>
