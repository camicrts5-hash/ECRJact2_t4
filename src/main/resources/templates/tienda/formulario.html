<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
    <h1 th:text="${nombreApp}">Nombre App</h1>
    <h2>Agregar Nuevo Producto</h2>
    
    <form th:action="@{/tienda/guardar}" th:object="${producto}" method="post">
        <label>Nombre: <input type="text" th:field="*{nombre}" /></label><br><br>
        <label>Precio: <input type="number" step="0.01" th:field="*{precio}" /></label><br><br>
        <label>Categoría: <input type="text" th:field="*{categoria}" /></label><br><br>
        <button type="submit">Guardar Producto</button>
    </form>
    <br>
    <a th:href="@{/tienda/productos}">Volver a la lista</a>
</body>
</html>
